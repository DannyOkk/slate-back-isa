name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested image to Azure Container Apps
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: slate-backend
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_ARCHIVE: slate-backend-image.tar

jobs:
  ci:
    name: Test, build and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests
        run: ./mvnw --batch-mode test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Grype
        uses: anchore/scan-action@v6
        with:
          image: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - name: Export tested image
        run: docker save "${IMAGE_REPOSITORY}:${IMAGE_TAG}" --output "${IMAGE_ARCHIVE}"

      - name: Upload tested image
        uses: actions/upload-artifact@v4
        with:
          name: tested-image-${{ github.sha }}
          path: ${{ env.IMAGE_ARCHIVE }}
          retention-days: 1

  publish:
    name: Publish tested image to ACR
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    environment: azure-acr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: tested-image-${{ github.sha }}

      - name: Load tested image
        run: docker load --input "${IMAGE_ARCHIVE}"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
            "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Log in to ACR
        run: az acr login --name "${{ secrets.AZURE_ACR_NAME }}"

      - name: Push tested image
        run: |
          docker tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            "${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          docker push \
            "${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${IMAGE_REPOSITORY}:${IMAGE_TAG}"

  deploy:
    name: Deploy tested image to Container Apps
    if: |
      (github.event_name == 'push' &&
        contains(github.event.head_commit.message, '[deploy]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    needs:
      - ci
      - publish
    runs-on: ubuntu-latest
    environment: azure-deploy
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
            "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name slate-back-isa \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            --only-show-errors

      - name: Verify active image and health
        shell: bash
        run: |
          set -euo pipefail
          image="$(az containerapp show \
            --name slate-back-isa \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.template.containers[0].image' \
            --output tsv)"
          expected="${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          test "$image" = "$expected"
          fqdn="$(az containerapp show \
            --name slate-back-isa \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' \
            --output tsv)"
          for attempt in $(seq 1 30); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "https://${fqdn}/actuator/health")"
            if [ "$code" = "200" ]; then
              echo "Health check passed: https://${fqdn}/actuator/health"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed for https://${fqdn}/actuator/health"
          exit 1
